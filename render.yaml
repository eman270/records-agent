services:
  - type: web
    name: records-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: GOOGLE_GENAI_USE_ENTERPRISE
        value: "False"
      - key: SUPABASE_TABLE
        value: employees
      - key: SUPABASE_SEARCH_COLUMNS
        value: name,department,location
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

  - type: web
    name: records-agent-ui
    runtime: docker
    dockerfilePath: ./Dockerfile.ui
    dockerContext: .
    plan: free
    envVars:
      - key: GOOGLE_GENAI_USE_ENTERPRISE
        value: "False"
      - key: SUPABASE_TABLE
        value: employees
      - key: SUPABASE_SEARCH_COLUMNS
        value: name,department,location
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
