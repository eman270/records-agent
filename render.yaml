services:
  - type: web
    name: records-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: GOOGLE_GENAI_USE_ENTERPRISE
        value: "False"
      - key: SUPABASE_TABLE
        value: employees
      - key: SUPABASE_SEARCH_COLUMNS
        value: name,department,location
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        sync: false
      - key: LANGFUSE_TRACING_ENVIRONMENT
        value: production

  - type: web
    name: records-agent-ui
    runtime: docker
    dockerfilePath: ./Dockerfile.ui
    dockerContext: .
    plan: free
    envVars:
      - key: GOOGLE_GENAI_USE_ENTERPRISE
        value: "False"
      - key: SUPABASE_TABLE
        value: employees
      - key: SUPABASE_SEARCH_COLUMNS
        value: name,department,location
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        sync: false
      - key: LANGFUSE_TRACING_ENVIRONMENT
        value: production
